    <h1>My Map</h1>

    <div id="map"></div>

    <button id="questionBtn">Questions?</button>

    <script>
      // Google Maps function
      function initMap() {
        const center = { lat: 41.8781, lng: -87.6298 }; // Chicago

        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 12,
          center: center,
        });

        const marker = new google.maps.Marker({
          position: center,
          map: map,
          title: "Chicago",
        });

        const info = new google.maps.InfoWindow({
          content: "<b>Chicago, Illinois</b>",
        });

        marker.addListener("click", () => {
          info.open(map, marker);
        });
      }
      window.initMap = initMap;
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1F-BpX660SBK3-Vw9O9f7AEvTAIH8rI&callback=initMap" async defer></script>

  </body>
